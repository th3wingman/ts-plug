<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>ts-multinet</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="offline-banner" class="banner banner--error" hidden>
    daemon unreachable — retrying…
  </div>

  <header class="topbar">
    <span class="topbar__title">ts-multinet</span>
    <nav class="tabs" id="tabs">
      <button class="tabs__btn is-active" data-view="dashboard" type="button">Dashboard</button>
      <button class="tabs__btn" data-view="peers" type="button">Peers</button>
      <button class="tabs__btn" data-view="config" type="button">Config</button>
    </nav>
    <button id="reload-btn" class="btn" type="button">Reload</button>
    <span id="reload-msg" class="topbar__msg"></span>
  </header>

  <main>
    <section id="view-dashboard" class="view"></section>
    <section id="view-peers" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
